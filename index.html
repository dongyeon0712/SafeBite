<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#127A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SafeBite">
<title>SafeBite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%23127A5C%22/%3E%3Cg%20transform%3D%22translate%28106%20106%29%20scale%2812.5%29%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%2013c0%205-3.5%207.5-7.66%208.95a1%201%200%200%201-.67-.01C7.5%2020.5%204%2018%204%2013V6a1%201%200%200%201%201-1c2%200%204.5-1.2%206.24-2.72a1.17%201.17%200%200%201%201.52%200C14.51%203.81%2017%205%2019%205a1%201%200%200%201%201%201z%22/%3E%3Cpath%20d%3D%22m9%2012%202%202%204-4%22/%3E%3C/g%3E%3C/svg%3E" type="image/svg+xml">
<style>
:root{
  --bg:#F2F2F7;--card:#fff;--ink:#141619;--sub:#737580;--line:#E6E6EB;
  --green:#127A5C;--green-d:#0A4A38;--green-l:#E0F5EC;
  --red:#E04040;--red-l:#FFEBEB;--amber:#F59E1A;--amber-l:#FFF3DA;--gray:#B0B2BA;
  --tab-h:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#E4E5EA;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;padding-top:env(safe-area-inset-top)}
.screen{padding:12px 20px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;min-height:100dvh;animation:in .18s ease-out}
.screen.notabs{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:28px;line-height:1.15;letter-spacing:-.4px;margin:0;font-weight:700}
h2{font-size:17px;margin:0;font-weight:600}
.sub{color:var(--sub);font-size:15px;margin:0}
.small{font-size:13px;color:var(--sub)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:20px;padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.nav .title{font-size:17px;font-weight:600;text-align:center;flex:1}
.circle-btn{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.pill-btn{background:var(--card);border-radius:22px;padding:11px 18px;font-weight:500;font-size:16px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px 24px;border-radius:28px;font-size:17px;font-weight:600;background:var(--green);color:#fff;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98);opacity:.92}
.btn.black{background:#000}
.btn.outline{background:var(--card);color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.btn.ghost{background:none;color:var(--green);padding:10px;font-size:16px;font-weight:500}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.danger{background:var(--red)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:11px 16px;border-radius:22px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:16px;font-weight:500}
.chip.on{background:var(--green);color:#fff;box-shadow:inset 0 0 0 1.5px var(--green)}
.chip.sm{padding:8px 14px;font-size:15px;gap:5px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x .chip{flex:none}
.tag{display:inline-block;background:var(--green-l);color:var(--green);font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--green);color:#fff;letter-spacing:.3px}

/* segmented */
.seg{display:flex;background:#E7E7EC;border-radius:14px;padding:3px}
.seg button{flex:1;padding:10px 4px;border-radius:11px;font-size:15px;font-weight:500}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on.red{color:var(--red)}

/* form */
.group{background:var(--card);border-radius:24px;overflow:hidden}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{font-size:16px}
.field input[type=text]{border:0;outline:0;text-align:right;background:none;font-size:16px;color:var(--sub);min-width:0;flex:1}
.field input[type=text]:focus{color:var(--ink)}
textarea{width:100%;border:0;outline:0;resize:none;background:none;font-size:16px;line-height:1.4}
.note-box{background:var(--card);border-radius:18px;padding:14px 16px}
.note-box .lbl{font-size:12px;font-weight:500;color:var(--sub);margin-bottom:4px}
.switch{width:51px;height:31px;border-radius:16px;background:#D7D8DE;position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px}
.search input{border:0;outline:0;flex:1;background:none;font-size:16px;min-width:0}
.loc-btn{display:inline-flex;align-items:center;gap:4px;background:var(--green-l);color:var(--green);border-radius:12px;padding:5px 10px;font-size:13px;font-weight:600;flex:none}

/* welcome */
.hero{background:var(--green);color:#fff;margin:-12px -20px 0;padding:calc(60px + env(safe-area-inset-top)) 32px 44px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.hero .logo{width:96px;height:96px;border-radius:32px;background:#fff;display:grid;place-items:center}
.hero h1{font-size:40px;letter-spacing:-.5px}
.hero p{margin:0;opacity:.9;font-size:17px;line-height:1.4}
.feat{display:flex;gap:16px;align-items:center}
.feat .ico{width:52px;height:52px;border-radius:16px;background:var(--green-l);display:grid;place-items:center;flex:none}
.feat b{display:block;font-size:17px}
.feat span{color:var(--sub);font-size:15px}
.sheet{background:#fff;border-radius:36px 36px 0 0;margin:-24px -20px 0;padding:34px 24px 28px;display:flex;flex-direction:column;gap:24px;flex:1}

/* pass */
.pass{background:var(--green);color:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 24px rgba(18,122,92,.28)}
.pass .hd{display:flex;align-items:center;justify-content:space-between}
.pass .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.pass .mark{width:36px;height:36px;border-radius:12px;background:#fff;display:grid;place-items:center}
.pass .sev{background:var(--red-l);color:var(--red);font-size:11px;font-weight:700;letter-spacing:.6px;padding:5px 10px;border-radius:10px}
.pass .sev.mild{background:#E8F5EE;color:var(--green)}
.pass .sev.mod{background:var(--amber-l);color:#B26A00}
.pass .k{font-size:11px;font-weight:600;letter-spacing:.8px;opacity:.7;text-transform:uppercase}
.pass .name{font-size:26px;font-weight:600}
.pass .al{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pass .al span{background:#fff;color:var(--green);font-weight:600;font-size:15px;padding:8px 14px;border-radius:18px}
.pass .meta{display:flex;gap:28px}
.pass .meta b{display:block;font-size:17px;font-weight:600;margin-top:3px}
.pass .prompt{background:var(--green-d);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.pass .prompt b{display:block;font-size:15px}
.pass .prompt span{font-size:12px;opacity:.75}

/* tap */
.tap{background:var(--green-d);color:#fff;border-radius:28px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.tap .rings{position:relative;width:220px;height:220px;display:grid;place-items:center}
.tap .rings i{position:absolute;border-radius:50%;background:rgba(255,255,255,.1);animation:pulse 2.4s ease-in-out infinite}
.tap .rings i:nth-child(1){width:220px;height:220px;animation-delay:.0s}
.tap .rings i:nth-child(2){width:168px;height:168px;background:rgba(255,255,255,.14);animation-delay:.3s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.tap .core{position:relative;width:110px;height:110px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .1s}
.tap .core:active{transform:scale(.95)}
.tap h2{font-size:24px;font-weight:700}
.tap p{margin:0;opacity:.8;font-size:15px;line-height:1.45}
.qr{background:#fff;border-radius:20px;padding:18px;display:grid;place-items:center;gap:10px;text-align:center}
.qr svg{width:200px;height:200px}

/* lists */
.rest{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:12px;text-align:left;width:100%}
.rest.mine{box-shadow:inset 0 0 0 2px var(--green)}
.rest .thumb{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;flex:none}
.rest .t1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rest .nm{font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center;min-width:0}
.rest .rt{display:flex;gap:3px;align-items:center;font-size:14px;font-weight:600;flex:none}
.rest .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.banner{display:flex;gap:10px;align-items:center;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.35}
.banner.g{background:var(--green-l);color:var(--green);font-weight:600}
.banner.a{background:var(--amber-l)}
#near:empty{display:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:14px}
.stat .i{width:40px;height:40px;border-radius:12px;background:var(--green-l);display:grid;place-items:center}
.stat b{font-size:22px;display:block;line-height:1}
.stars{display:flex;gap:2px}
.stars.big{gap:8px;justify-content:center}
.stars.big button{width:44px;height:44px}
.rev{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.rev.new{box-shadow:inset 0 0 0 2px var(--green)}
.rev p{margin:0;font-size:14px;line-height:1.45}
.link{color:var(--green);font-weight:600;font-size:13px;display:inline-flex;gap:4px;align-items:center}
.empty{text-align:center;color:var(--sub);padding:28px 8px;font-size:15px;line-height:1.5}

/* receiver (kitchen) */
.kitchen{background:#F2F2F7}
.kbar{background:var(--ink);color:#fff;margin:-12px -20px 0;padding:calc(16px + env(safe-area-inset-top)) 20px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.kbar .l{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.kbar .m{width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center}
.ticket{background:#fff;border-radius:22px;box-shadow:inset 0 0 0 3px var(--red);overflow:hidden}
.ticket.ack{box-shadow:inset 0 0 0 3px var(--green)}
.ticket .th{background:var(--red);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:1px;font-size:18px}
.ticket.ack .th{background:var(--green)}
.ticket .tb{padding:18px;display:flex;flex-direction:column;gap:16px}
.ticket .who{font-size:28px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
.dns{display:flex;flex-wrap:wrap;gap:10px}
.dns span{display:inline-flex;align-items:center;gap:7px;background:var(--red-l);color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red);padding:9px 16px;border-radius:22px;font-weight:700;font-size:18px}
.lbl{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--sub);text-transform:uppercase}
.lbl.red{color:var(--red)}
.chk{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--gray);width:100%;text-align:left;font-size:16px;font-weight:500}
.chk.on{background:var(--green-l);box-shadow:inset 0 0 0 1.5px var(--green)}
.chk .bx{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--gray);display:grid;place-items:center;flex:none}
.chk.on .bx{background:var(--green);box-shadow:none}
.box{background:var(--bg);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.45}

/* tabs */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;justify-content:space-around;padding:10px 20px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:5}
#tabbar[hidden]{display:none}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--sub);min-width:70px}
#tabbar button.on{color:var(--green)}
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 20px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:10;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:431px){#app{box-shadow:0 0 0 1px rgba(0,0,0,.06),0 20px 60px rgba(0,0,0,.12)}}
@media print{#tabbar,#toast{display:none}}

/* ===== v2: Figma-matched screens ===== */
.field{font-size:16px}
.field input[type=text],.field input[type=date],.field select{border:0;outline:0;text-align:right;background:none;font-size:16px;color:var(--sub);min-width:0;flex:1;max-width:60%;font-family:inherit}
.field input[type=date]{text-align:right;-webkit-appearance:none;appearance:none}
.field select{text-align-last:right;-webkit-appearance:none;appearance:none;cursor:pointer}
.field input:focus{color:var(--ink)}
.field.rowlink{width:100%;text-align:left}
.field .val{display:inline-flex;align-items:center;gap:6px;color:var(--sub)}
.field .val.g{color:var(--green)}
.field .val.r{color:var(--red)}
.avatar{width:88px;height:88px;border-radius:50%;background:#DCD3FA;color:#7359D9;display:grid;place-items:center;font-size:32px;font-weight:600;align-self:center}
.ios-link{color:#0A84FF;font-size:17px;padding:10px 4px;min-width:60px}
.ios-link.bold{font-weight:600;text-align:right}
.btn.light{background:#fff;color:var(--green-d)}
.btn-sm{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border-radius:16px;padding:12px 6px}
.mute{color:var(--sub)}

/* wallet */
#app.white,body.white{background:#fff}
.screen.wallet{background:#fff}
.plus-circle{width:40px;height:40px;border-radius:50%;background:#000;display:grid;place-items:center}
.stackcards{display:flex;flex-direction:column;padding-top:6px}
.wcard{height:200px;border-radius:20px;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;margin-bottom:-142px;box-shadow:0 -4px 14px rgba(0,0,0,.18);position:relative}
.wcard b{font-size:16px}
.wcard .r{text-align:right;display:flex;flex-direction:column}
.wcard .r i{font-size:10px;font-weight:600;opacity:.7;font-style:normal}
.wcard .r span{font-size:16px;font-weight:500}
.stackcards .pass{position:relative;z-index:3;margin-top:0;box-shadow:0 -4px 14px rgba(0,0,0,.18),0 8px 24px rgba(18,122,92,.28);cursor:pointer}
.addpass .pass{margin-top:4px}

/* tap */
#app.dark,body.dark{background:var(--green-d)}
.screen.dark{background:var(--green-d);color:#fff}
.ctx-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);color:#fff;font-size:14px;font-weight:500;padding:7px 14px;border-radius:16px}
.ctx-edit{width:100%}
.ctx-edit .field{color:var(--ink)}
.tap-mid{display:flex;flex-direction:column;align-items:center;gap:20px;padding:10px 0}
.tap-mid .rings{position:relative;width:300px;height:300px;display:grid;place-items:center}
.tap-mid .rings i{position:absolute;border-radius:50%;background:rgba(255,255,255,.07);animation:pulse 2.4s ease-in-out infinite}
.tap-mid .rings i:nth-child(1){width:300px;height:300px}
.tap-mid .rings i:nth-child(2){width:228px;height:228px;background:rgba(255,255,255,.1);animation-delay:.3s}
.tap-mid .core{position:relative;width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .1s;box-shadow:0 0 0 14px rgba(255,255,255,.14)}
.tap-mid .core:active{transform:scale(.94)}
.tap-sub{margin:0;text-align:center;font-size:16px;line-height:1.45;opacity:.82;max-width:320px}
.preview-pass{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.14);border-radius:20px;padding:14px}
.preview-pass .lg{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none}
.preview-pass b{display:block;font-size:16px}
.preview-pass span{font-size:14px;opacity:.8}
.screen.dark .qr{background:#fff;color:var(--ink)}

/* sent */
.hero-card{background:var(--green);color:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.hero-card .ok{width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center}
.hero-card h2{font-size:24px;font-weight:700;margin:0}
.hero-card p{margin:0;opacity:.9;font-size:15px;line-height:1.4}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 2px var(--gray)}
.dot.done{background:var(--green);box-shadow:none}
.dot.now{background:var(--amber-l);box-shadow:inset 0 0 0 2.5px var(--amber)}
.dot.now i{width:10px;height:10px;border-radius:50%;background:var(--amber)}

/* kitchen: tablet-friendly */
#app.wide{max-width:760px}
.chk-grid{display:flex;flex-wrap:wrap;gap:10px}
.chk-grid .chk{width:auto;flex:1 1 280px}
.ticket .th{font-size:20px}
@media (min-width:700px){.kitchen .who{font-size:34px}.kbar{margin-top:0}}

</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<nav id="tabbar" hidden></nav>

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } },
};
const blankProfile = () => ({ first: '', last: '', dob: '', emergency: '', blood: 'Not Set', allergens: [], custom: [], severity: 'Anaphylactic', epi: false, notes: '', wallet: false });
function loadProfile() {
  const p = store.get('sb_profile', null);
  if (!p) return null;
  const m = { ...blankProfile(), ...p };
  if (p.name && !p.first) { const parts = p.name.trim().split(/\s+/); m.first = parts[0] || ''; m.last = parts.slice(1).join(' '); }
  return m;
}
const S = {
  profile: loadProfile(),
  reviews: store.get('sb_reviews', []),
  ctx: store.get('sb_ctx', { rest: 'verdant', table: '12' }),
  sent: store.get('sb_sent', null),
  loc: store.get('sb_loc', 'Capitol Hill, Seattle'),
  walletReal: false, q: '', cat: 'All', draft: null, justPosted: false, kchecks: [], kdata: '', ack: {}, showQR: false, editCtx: false,
};
const saveProfile = () => store.set('sb_profile', S.profile);
const saveReviews = () => store.set('sb_reviews', S.reviews);
const saveCtx = () => store.set('sb_ctx', S.ctx);
const saveSent = () => store.set('sb_sent', S.sent);
const fullName = (p) => `${p.first} ${p.last}`.trim();
const allergenList = (p) => [...p.allergens, ...p.custom];
const ready = () => !!(S.profile && S.profile.first.trim() && allergenList(S.profile).length);

/* ---------- pass link (data lives in the URL fragment, never sent to a server) ---------- */
const b64e = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = (s) => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/')))));
function payload() {
  const p = S.profile;
  return { v: 1, n: fullName(p), a: allergenList(p), s: p.severity, e: p.epi, x: p.notes.trim(), r: restById(S.ctx.rest).name, t: String(S.ctx.table || '').trim(), ts: Date.now() };
}
const passLink = () => location.href.split('#')[0] + '#/r/' + b64e(payload());
/* Real Apple Wallet pass (needs the Node server + Apple certificates, see SETUP.md) */
const isApple = () => /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
const realWallet = () => S.walletReal && isApple();
const passUrl = () => { const p = S.profile; return '/pass.pkpass?d=' + b64e({ n: fullName(p), a: allergenList(p), s: p.severity, e: p.epi, x: p.notes.trim(), c: p.emergency.trim() }); };

/* ---------- helpers ---------- */
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 2200);
}
const hash = (s) => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const sevClass = (s) => (s === 'Mild' ? 'mild' : s === 'Moderate' ? 'mod' : '');
function rating(r) {
  const mine = S.reviews.filter((x) => x.rest === r.id);
  const sum = r.base * r.n + mine.reduce((a, x) => a + x.stars, 0);
  return { score: sum / (r.n + mine.length), n: r.n + mine.length, mine: mine.length > 0 };
}
const dist = (r) => (S.loc === 'Capitol Hill, Seattle' ? r.mi : ((hash(S.loc + r.id) % 28) / 10 + 0.2)).toFixed(1);
function when(ts) {
  const m = (Date.now() - ts) / 60000;
  if (m < 2) return 'Just now';
  if (m < 1440) return 'Today';
  return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' });
}
const timeStr = (ts) => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const stars = (n, s = 15) => `<span class="stars">${[1, 2, 3, 4, 5].map((i) => star(s, i <= n ? '#F59E1A' : '#D9DAE0')).join('')}</span>`;
const initials = (p) => ((p.first || '')[0] || '') + ((p.last || '')[0] || '') || '·';
const allergySummary = (p) => { const l = allergenList(p); return l.length > 2 ? `${l.slice(0, 2).join(', ')} +${l.length - 2}` : l.join(', ') || 'None'; };

/* ---------- components ---------- */
function passCard(p, o = {}) {
  const list = Array.isArray(p.allergens) ? allergenList(p) : p.a;
  const name = o.name ?? fullName(p);
  return `<div class="pass" ${o.go ? `data-go="${o.go}" role="button" tabindex="0"` : ''}>
    <div class="hd"><div class="brand"><span class="mark">${ic('shield', 22, '#127A5C')}</span>SafeBite</div><span class="sev ${sevClass(p.severity)}">${esc(p.severity).toUpperCase()}</span></div>
    <div><div class="k">Name</div><div class="name">${esc(name) || 'Your name'}</div></div>
    <div><div class="k">Allergies — do not serve</div><div class="al">${list.map((a) => `<span>${esc(a)}</span>`).join('') || '<span>None selected</span>'}</div></div>
    <div class="meta"><div><div class="k">Epinephrine</div><b>${p.epi ? 'Carries' : 'No'}</b></div><div><div class="k">Cross-contact</div><b>Avoid</b></div></div>
    ${o.prompt ? `<div class="prompt">${ic('nfc', 28, '#fff')}<div><b>Tap to share with your server</b><span>Shares with the kitchen instantly</span></div></div>` : ''}
  </div>`;
}
function restCard(r, i) {
  const rt = rating(r);
  return `<button class="rest ${rt.mine ? 'mine' : ''}" data-act="dine" data-v="${r.id}">
    <div class="thumb" style="background:${TINTS[i % TINTS.length]}">${ic('chef', 30, '#127A5C', 1.8)}</div>
    <div class="grow">
      <div class="t1"><div class="nm"><span>${i + 1}. ${esc(r.name)}</span>${rt.mine ? '<span class="badge">Reviewed</span>' : ''}</div>
        <div class="rt">${star(14)}${rt.score.toFixed(1)}</div></div>
      <div class="small">${esc(r.cat)} · ${dist(r)} mi · ${rt.n} reviews</div>
      <div class="tags">${r.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div></button>`;
}
function listHtml() {
  const q = S.q.trim().toLowerCase();
  const rows = RESTS.filter((r) => (S.cat === 'All' || r.cat === S.cat) && (!q || (r.name + ' ' + r.cat + ' ' + r.tags.join(' ')).toLowerCase().includes(q)))
    .sort((a, b) => rating(b).score - rating(a).score || dist(a) - dist(b));
  return rows.length ? rows.map(restCard).join('') : `<div class="empty">No matches nearby.<br>Try another food type or area.</div>`;
}
function nearHint() {
  const q = S.q.trim();
  return q ? `<button class="banner a" data-act="setloc" style="width:100%;text-align:left">${ic('pin', 18, '#B26A00')}<span>Search near <b>“${esc(q)}”</b></span></button>` : '';
}
const navBar = (title, o = {}) => `<div class="nav">${o.back ? `<button class="circle-btn" data-go="${o.back}" aria-label="Back">${ic('chevL', 22)}</button>` : '<span style="width:44px"></span>'}<div class="title">${title}</div>${o.right || '<span style="width:44px"></span>'}</div>`;

    <div class="sheet">
      <div class="feat"><div class="ico">${ic('user', 26, '#127A5C')}</div><div><b>Build your allergy profile</b><span>Tell us once what to avoid.</span></div></div>

function vReceiver(data) {
  let d;
  try { d = b64d(data); if (!d || !Array.isArray(d.a)) throw 0; }
  catch { return `<section class="screen notabs"><div class="empty">${ic('alert', 36, '#E04040')}<h2 style="margin:10px 0 4px">This link looks incomplete</h2>Ask the guest to share their allergy pass again.</div><button class="btn" data-go="/">Open SafeBite</button></section>`; }
  if (S.kdata !== data) { S.kdata = data; S.kchecks = KITCHEN_CHECKS.map(() => false); }
  const ack = S.ack[data];
  const sev = d.s || 'Allergy';
  return `<section class="screen notabs kitchen">
    <div class="kbar"><div class="l"><span class="m">${ic('shield', 18, '#fff')}</span>${esc(d.r || 'Kitchen')} · Ticket</div><span class="small" style="color:#fff;opacity:.8">${timeStr(d.ts || Date.now())}</span></div>
    <div class="ticket ${ack ? 'ack' : ''}">
      <div class="th">${ack ? ic('check', 22, '#fff', 3) + 'ACKNOWLEDGED' : ic('alert', 22, '#fff', 2.4) + 'ALLERGY ALERT'}</div>
      <div class="tb">
        <div><div class="who">${esc(d.n) || 'Guest'}${d.t ? ` · Table ${esc(d.t)}` : ''}</div>
          <div class="small" style="margin-top:4px">${esc(sev)}${d.e ? ' · carries epinephrine' : ''} · shared ${timeStr(d.ts || Date.now())}${ack ? ` · acknowledged ${timeStr(ack)}` : ''}</div></div>
        <div class="stack" style="gap:8px"><div class="lbl red">Do not serve</div><div class="dns">${d.a.map((a) => `<span>${ic('x', 16, '#E04040', 3)}${esc(a)}</span>`).join('')}</div></div>
        ${d.x ? `<div class="stack" style="gap:6px"><div class="lbl">Notes</div><div class="box">${esc(d.x)}</div></div>` : ''}
        <div class="stack" style="gap:8px"><div class="lbl">Safe-prep checklist</div>
          <div class="chk-grid">${KITCHEN_CHECKS.map((c, i) => `<button class="chk ${S.kchecks[i] ? 'on' : ''}" data-act="kcheck" data-v="${i}"><span class="bx">${S.kchecks[i] ? ic('check', 14, '#fff', 3.4) : ''}</span>${esc(c)}</button>`).join('')}</div></div>
        ${ack ? '' : `<button class="btn" data-act="ack">${ic('check', 22, '#fff', 2.6)}Acknowledge alert</button>`}
      </div>
    </div>
    <p class="small" style="text-align:center;margin:0">Allergy info shared by the guest with SafeBite. Always confirm with the guest at the table.</p>
    <div style="flex:1"></div>
    <button class="btn ghost" data-go="/">Open SafeBite</button>
  </section>`;
}

      <div><b style="font-size:18px">${esc(r.name)}</b><div class="small">${S.ctx.table ? 'Table ' + esc(S.ctx.table) + ' · ' : ''}${d.edit ? 'Edited review' : 'Today'}</div></div></div>
    <div class="stack" style="align-items:center;gap:12px"><h2 style="font-size:22px;text-align:center">How was your allergen-safe meal?</h2>
      <div class="stars big">${[1, 2, 3, 4, 5].map((i) => `<button data-act="star" data-v="${i}" aria-label="${i} star${i > 1 ? 's' : ''}">${star(44, i <= d.stars ? '#F59E1A' : '#D9DAE0')}</button>`).join('')}</div>
      <div class="small" style="font-size:15px">${labels[d.stars]}</div></div>
    <h2>What went well?</h2>
    <div class="chips">${REVIEW_TAGS.map((t) => { const on = d.tags.includes(t); return `<button class="chip sm ${on ? 'on' : ''}" data-act="tag" data-v="${esc(t)}" aria-pressed="${on}">${on ? ic('check', 14, '#fff', 3) : ''}${esc(t)}</button>`; }).join('')}</div>
    <div class="note-box"><div class="lbl">Add a note (optional)</div><textarea rows="3" data-bind="rnote" placeholder="What should other diners with allergies know?">${esc(d.note)}</textarea></div>
    <div class="banner a">${star(26)}<span><b>Your review lifts their Allergy-Safe Score</b></span></div>
    <div style="flex:1"></div>
    <button class="btn" data-act="post">${d.edit ? 'Save changes' : 'Post review'}</button>
    ${d.edit ? `<button class="btn ghost" data-act="delreview" style="color:var(--red)">Delete review</button>` : ''}
  </section>`;
}

function vExplore() {
  const posted = S.justPosted; S.justPosted = false;
  return `<section class="screen">
    ${posted ? `<div class="banner g">${ic('check', 18, '#127A5C', 3)}<span>Review posted — thanks for helping others!</span></div>` : ''}
    <div class="stack" style="gap:2px"><h1>Top allergy-safe spots</h1><p class="sub">Highest-rated by diners with allergies · near ${esc(S.loc)}</p></div>
    <button class="banner g" data-go="/wallet" style="width:100%;text-align:left;justify-content:space-between"><span class="row" style="gap:10px">${ic('wallet', 22, '#127A5C')}<span>Dining out? <b>Open your allergy pass</b></span></span>${ic('chevR', 18, '#127A5C')}</button>
    <div class="search">${ic('search', 20, '#737580')}<input id="f-q" data-bind="q" placeholder="Address or food" value="${esc(S.q)}" enterkeyhint="search" autocomplete="off"><button class="loc-btn" data-act="resetloc" aria-label="Use my location">${ic('pin', 14, '#127A5C', 2.4)}Near me</button></div>
    <div id="near">${nearHint()}</div>
    <div class="scroll-x" role="group" aria-label="Food category">${CATS.map((c) => `<button class="chip sm ${S.cat === c ? 'on' : ''}" data-act="cat" data-v="${c}">${c}</button>`).join('')}</div>
    <div class="stack" id="list">${listHtml()}</div>
  </section>`;
}

function vReviews() {
  const n = S.reviews.length, avg = n ? (S.reviews.reduce((a, x) => a + x.stars, 0) / n).toFixed(1) : '–';
  return `<section class="screen">
    <div class="stack" style="gap:2px"><h1>My reviews</h1><p class="sub">Your reviews help others eat safely</p></div>
    <div class="stats"><div class="stat"><div class="i">${ic('star', 20, '#127A5C')}</div><div><b>${n}</b><span class="small">Reviews</span></div></div>
      <div class="stat"><div class="i">${ic('heart', 20, '#127A5C')}</div><div><b>${avg}</b><span class="small">Avg. rating</span></div></div></div>
    ${n ? S.reviews.map((x, i) => { const r = restById(x.rest); const fresh = i === 0 && Date.now() - x.ts < 120000; return `<div class="rev ${fresh ? 'new' : ''}">
      <div class="row between"><div class="row" style="gap:8px"><b style="font-size:17px">${esc(r.name)}</b>${fresh ? '<span class="badge">New</span>' : ''}</div>
      <button class="link" data-go="/review?id=${x.id}">${ic('pencil', 14, '#127A5C', 2.2)}Edit</button></div>
      <div class="row" style="gap:8px">${stars(x.stars)}<span class="small">${when(x.ts)}</span></div>
      ${x.tags.length ? `<div class="tags" style="display:flex;gap:6px;flex-wrap:wrap">${x.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      ${x.note ? `<p>${esc(x.note)}</p>` : ''}</div>`; }).join('')
      : `<div class="empty">${ic('star', 32, '#B0B2BA')}<br><br>No reviews yet.<br>After a safe meal, confirm you were served and leave one.</div>`}
  </section>`;
}

/* ---------- router / render ---------- */
const TABS = [['/explore', 'compass', 'Explore'], ['/reviews', 'star', 'Reviews'], ['/profile', 'user', 'Profile']];
function route() {
  const h = location.hash.slice(1) || '/';
  const i = h.indexOf('?');
  return { path: i < 0 ? h : h.slice(0, i), qs: new URLSearchParams(i < 0 ? '' : h.slice(i + 1)) };
}
const go = (p) => { location.hash = p; };

function render(keep) {
  const y = window.scrollY;
  const { path, qs } = route();
  let html = '', tabs = false, cls = '';
  const setup = !!qs.get('setup');
  if (path.startsWith('/r/')) { html = vReceiver(path.slice(3)); cls = 'wide'; }
  else if (path === '/' || path === '') { go(ready() ? '/explore' : '/welcome'); return; }
  else if (path === '/welcome') html = vWelcome();
  else if (path === '/details' && setup) { if (!S.profile) { S.profile = blankProfile(); saveProfile(); } html = vDetails(true); }
  else if (path === '/allergens' && setup) { if (!S.profile) { go('/details?setup=1'); return; } html = vAllergens(true); }
  else if (!ready()) { go('/welcome'); return; }
  else if (path === '/profile') { tabs = '/profile'; html = vDetails(false); }
  else if (path === '/allergens') html = vAllergens(false);
  else if (path === '/addpass') html = vAddPass();
  else if (path === '/wallet') { tabs = '-'; cls = 'white'; if (!S.profile.wallet) { go('/addpass'); return; } html = vWallet(); }
  else if (path === '/tap') { cls = 'dark'; html = vTap(); }
  else if (path === '/sent') html = vSent();
  else if (path === '/explore') { tabs = '/explore'; html = vExplore(); }
  else if (path === '/reviews') { tabs = '/reviews'; html = vReviews(); }
  else if (path === '/review') html = vReview(qs);
  else { go('/'); return; }
  if (path !== '/review') S.draft = null;
  if (path !== '/tap') { S.showQR = false; S.editCtx = false; }
  app.className = cls;
  document.body.className = cls;
  app.innerHTML = html;
  if (keep && app.firstElementChild) app.firstElementChild.style.animation = 'none';
  tabbar.hidden = !tabs;
  tabbar.innerHTML = tabs ? TABS.map(([p, i, l]) => `<button class="${p === tabs ? 'on' : ''}" data-go="${p}" aria-label="${l}">${ic(i, 24, 'currentColor', 2)}${l}</button>`).join('') : '';
  document.title = 'SafeBite';
  if (path === '/tap' && S.showQR) drawQR();
  window.scrollTo(0, keep ? y : 0);
}
const rerender = () => render(true);

function drawQR() {
  const el = $('#qr'); if (!el) return;
  try {
    const q = qrcode(0, 'M'); q.addData(passLink()); q.make();
    el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  } catch { el.innerHTML = '<div class="small">QR unavailable offline — use “Copy link”.</div>'; }
}

/* ---------- actions ---------- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch { /* noop */ }
    ta.remove(); return ok;
  }
}
function markShared() { S.sent = { ts: Date.now(), served: false }; saveSent(); go('/sent'); }
async function doShare() {
  const p = S.profile, url = passLink();
  const text = `${fullName(p)} has food allergies: ${allergenList(p).join(', ')}. Open this link to see the full allergy alert.`;
  if (navigator.share) {
    try { await navigator.share({ title: 'SafeBite allergy alert', text, url }); markShared(); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  S.showQR = true; rerender();
  toast((await copyText(url)) ? 'Link copied — send it to your server, or show the QR' : 'Show the QR code to your server');
}
function addCustom() {
  const el = $('#f-custom'); const v = (el ? el.value : '').trim();
  if (!v) return;
  const all = [...ALLERGENS, ...S.profile.custom].map((a) => a.toLowerCase());
  if (!all.includes(v.toLowerCase())) { S.profile.custom.push(v); saveProfile(); }
  rerender();
}
const refreshCta = () => { const b = $('#walletBtn'); if (b) b.disabled = !allergenList(S.profile).length; };

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-act]'); if (!t) return;
  if (t.dataset.go) { go(t.dataset.go); return; }
  const a = t.dataset.act, v = t.dataset.v, p = S.profile;
  switch (a) {
    case 'allergen': p.allergens = p.allergens.includes(v) ? p.allergens.filter((x) => x !== v) : [...p.allergens, v]; saveProfile(); rerender(); break;
    case 'rmcustom': p.custom = p.custom.filter((x) => x !== v); saveProfile(); rerender(); break;
    case 'addcustom': addCustom(); break;
    case 'sev': p.severity = v; saveProfile(); rerender(); break;
    case 'epi': p.epi = !p.epi; saveProfile(); rerender(); break;
    case 'towallet': if (allergenList(p).length) go('/addpass'); break;
    case 'updatewallet': if (realWallet()) { toast('Re-adding your updated pass…'); location.href = passUrl(); setTimeout(() => go('/wallet'), 900); } else { toast('Wallet pass updated'); go('/wallet'); } break;
    case 'realpass': location.href = passUrl(); break;
    case 'addpass': p.wallet = true; saveProfile(); if (realWallet()) { toast('Opening Apple Wallet…'); location.href = passUrl(); setTimeout(() => go('/wallet'), 900); } else { toast('Added to Wallet'); go('/wallet'); } break;
    case 'walletplus': toast('Only your SafeBite pass is supported for now'); break;
    case 'editctx': S.editCtx = !S.editCtx; rerender(); break;
    case 'share': doShare(); break;
    case 'toggleqr': S.showQR = !S.showQR; rerender(); break;
    case 'copy': copyText(passLink()).then((ok) => toast(ok ? 'Link copied' : 'Couldn’t copy')); break;
    case 'preview': go('/r/' + b64e(payload())); break;
    case 'shared': markShared(); break;
    case 'served': S.sent = { ...(S.sent || { ts: Date.now() }), served: true, servedTs: Date.now() }; saveSent(); rerender(); break;
    case 'dine': S.ctx.rest = v; saveCtx(); go('/tap'); break;
    case 'cat': S.cat = v; rerender(); break;
    case 'setloc': if (S.q.trim()) { S.loc = S.q.trim(); store.set('sb_loc', S.loc); S.q = ''; toast('Showing spots near ' + S.loc); rerender(); } break;
    case 'resetloc': S.loc = 'Capitol Hill, Seattle'; store.set('sb_loc', S.loc); S.q = ''; rerender(); break;
    case 'kcheck': S.kchecks[+v] = !S.kchecks[+v]; rerender(); break;
    case 'ack': S.ack[S.kdata] = Date.now(); rerender(); toast('Marked as acknowledged'); break;
    case 'star': S.draft.stars = +v; rerender(); break;
    case 'tag': S.draft.tags = S.draft.tags.includes(v) ? S.draft.tags.filter((x) => x !== v) : [...S.draft.tags, v]; rerender(); break;
    case 'cancelreview': S.draft = null; history.length > 1 ? history.back() : go('/explore'); break;
    case 'post': {
      const d = S.draft, rec = { id: d.id || Date.now(), rest: d.rest, stars: d.stars, tags: d.tags, note: d.note.trim(), ts: d.ts || Date.now() };
      S.reviews = d.edit ? S.reviews.map((x) => (x.id === d.id ? rec : x)) : [rec, ...S.reviews];
      saveReviews(); S.draft = null;
      if (d.edit) { toast('Review updated'); go('/reviews'); } else { S.justPosted = true; go('/explore'); }
      break;
    }
    case 'delreview': if (confirm('Delete this review?')) { S.reviews = S.reviews.filter((x) => x.id !== S.draft.id); saveReviews(); S.draft = null; toast('Review deleted'); go('/reviews'); } break;
  }
});

document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.bind; if (!k) return;
  const v = e.target.value;
  if (['first', 'last', 'dob', 'emergency'].includes(k)) {
    S.profile[k] = v; saveProfile();
    const b = $('#contBtn'); if (b) b.disabled = !S.profile.first.trim();
    const av = $('#avatar'); if (av) av.textContent = initials(S.profile);
  }
  else if (k === 'notes') { S.profile.notes = v; saveProfile(); }
  else if (k === 'table') { S.ctx.table = v; saveCtx(); }
  else if (k === 'rnote') { S.draft.note = v; }
  else if (k === 'q') { S.q = v; $('#list').innerHTML = listHtml(); $('#near').innerHTML = nearHint(); }
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.bind; if (!k) return;
  if (k === 'rest') { S.ctx.rest = e.target.value; saveCtx(); rerender(); }
  else if (k === 'blood') { S.profile.blood = e.target.value; saveProfile(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const k = e.target.dataset && e.target.dataset.bind;
  if (k === 'custom') { e.preventDefault(); addCustom(); }
  else if (k === 'q') { e.preventDefault(); const b = document.querySelector('[data-act="setloc"]'); if (b) b.click(); e.target.blur(); }
  else if (k) e.target.blur();
  else if (e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.dataset.go) go(e.target.dataset.go);
});

window.addEventListener('hashchange', () => render(false));
render(false);
if (location.protocol.startsWith('http')) {
  fetch('/api/config', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((j) => {
    if (j && j.wallet) { S.walletReal = true; if (['/addpass', '/wallet'].includes(route().path)) rerender(); }
  }).catch(() => { /* static hosting: in-app Wallet preview only */ });
}

</script>
</body>
</html>
